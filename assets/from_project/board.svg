                <svg id="board-svg" viewBox="-95,-95,190,190" width="1140" height="1140" xmlns="http://www.w3.org/2000/svg">
<rect x="-95" y="-95" width="190" height="190" fill="#f5f2ed"/>
                    <defs>
                        <!-- 发光滤镜 -->
                        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
                            <feMerge>
                                <feMergeNode in="coloredBlur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>

                        <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
                            <feGaussianBlur stdDeviation="1" result="blur1" />
                            <feGaussianBlur stdDeviation="2" result="blur2" />
                            <feGaussianBlur stdDeviation="4" result="blur3" />
                            <feMerge>
                                    <feMergeNode in="blur3" />
                                    <feMergeNode in="blur2" />
                                    <feMergeNode in="blur1" />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                        </filter>

                        <!-- 棋子阴影滤镜 -->
                        <filter id="chessShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="0.5" />
                            <feOffset id="chessShadowOffset" dx="0" dy="1" result="offsetblur" />
                            <feFlood class="chess-shadow-flood" flood-opacity="0.15" />
                            <feComposite in2="offsetblur" operator="in" />
                            <feMerge>
                                <feMergeNode />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>

                        <!-- 基础组件定义 -->
                        <rect id="vr" stroke="currentColor" rx="2" ry="2" x="-5.5" y="-7.5" width="11" height="15" stroke-width="0.8" fill="currentColor" />
                        <rect id="hr" stroke="currentColor" rx="2" ry="2" x="-7.5" y="-5.5" width="15" height="11" stroke-width="0.8" fill="currentColor" />
                        <rect id="vr2" stroke="currentColor" rx="2" ry="2" x="-5" y="-5.5" width="10" height="11" stroke-width="0.8" fill="currentColor" />
                        <rect id="hr2" stroke="currentColor" rx="2" ry="2" x="-5.5" y="-5" width="11" height="10" stroke-width="0.8" fill="currentColor" />

                        <!-- 转角组件 -->
                        <path id="t1" stroke="currentColor" d="M6.16 6.45A0.5 0.5 0 0 1 5.81 7.3H-5.5A2 2 0 0 1 -7.5 5.3V-5.81A0.5 0.5 0 0 1 -6.65 -6.16Z" stroke-width="0.8" fill="currentColor" />
                        <path id="t2" stroke="currentColor" d="M-6.16 6.45A0.5 0.5 0 0 0 -5.81 7.3H5.5A2 2 0 0 0 7.5 5.3V-5.81A0.5 0.5 0 0 0 6.65 -6.16Z" stroke-width="0.8" fill="currentColor" />
                        <path id="t3" stroke="currentColor" d="M6.16 -6.45A0.5 0.5 0 0 0 5.81 -7.3H-5.5A2 2 0 0 0 -7.5 -5.3V5.81A0.5 0.5 0 0 0 -6.65 6.16Z" stroke-width="0.8" fill="currentColor" />
                        <path id="t4" stroke="currentColor" d="M-6.16 -6.45A0.5 0.5 0 0 1 -5.81 -7.3H5.5A2 2 0 0 1 7.5 -5.3V5.81A0.5 0.5 0 0 1 6.65 6.16Z" stroke-width="0.8" fill="currentColor" />

                        <!-- 终点三角形 -->
                        <path id="end" stroke="currentColor" d="M0,0L-10,10Q-8,10 -6,10H6Q8,10 10,10L0,0Z" stroke-width="0.6" fill="currentColor" stroke-linejoin="round" stroke-linecap="round" />
                        <!-- 起飞区域 -->
                        <g id="start">
                            <rect width="28" height="28" x="-14" y="-14" rx="2" ry="2" stroke="currentColor" stroke-width="0.6" fill="none" />
                            <circle stroke="currentColor" r="4.8" cx="5.8" cy="5.8" stroke-width="0.6" fill="none" />
                            <circle stroke="currentColor" r="4.8" cx="-5.8" cy="5.8" stroke-width="0.6" fill="none" />
                            <circle stroke="currentColor" r="4.8" cx="5.8" cy="-5.8" stroke-width="0.6" fill="none" />
                            <circle stroke="currentColor" r="4.8" cx="-5.8" cy="-5.8" stroke-width="0.6" fill="none" />
                        </g>
                        <!-- 箭头指示 -->
                        <path id="arrow" fill="currentColor" transform="scale(0.8)" d="M8.29289 2.29289C8.68342 1.90237 9.31658 1.90237 9.70711 2.29289L14.2071 6.79289C14.5976 7.18342 14.5976 7.81658 14.2071 8.20711L9.70711 12.7071C9.31658 13.0976 8.68342 13.0976 8.29289 12.7071C7.90237 12.3166 7.90237 11.6834 8.29289 11.2929L11 8.5H1.5C0.947715 8.5 0.5 8.05228 0.5 7.5C0.5 6.94772 0.947715 6.5 1.5 6.5H11L8.29289 3.70711C7.90237 3.31658 7.90237 2.68342 8.29289 2.29289Z" />
                        <g id="chess" viewBox="0 0 33 33" transform="scale(0.34)">
                            <circle cx="16.5" cy="16.5" r="16" fill="transparent" stroke="none" />
                            <circle cx="16.5" cy="16.5" r="14" fill="none" stroke="currentColor" stroke-width="3" />
                            <circle cx="16.5" cy="16.5" r="13" fill="currentColor" class="chess-fill" />
                            <!-- 飞机中心图案 -->
                            <path class="chess-airplane" d="M599.06048 831.309824l12.106752-193.404928 372.860928 184.430592L984.02816 710.206464 617.906176 367.33952 617.906176 151.638016c0-56.974336-46.188544-143.064064-103.158784-143.064064-56.974336 0-103.158784 86.089728-103.158784 143.064064L411.588608 367.33952 45.461504 710.206464l0 112.129024 366.660608-184.430592 14.999552 209.27488c0 5.05344 0.594944 9.892864 1.124352 14.749696l-66.591744 60.348416 0 66.587648 153.986048-50.879488 2.43712-0.80896 147.439616 51.688448 0-66.587648-68.758528-62.253056L599.06048 831.309824z" fill="white" transform="translate(16.5, 16.5) rotate(90) scale(0.018) translate(-512, -512)" />
                        </g>

                        <!-- 勾号图案（到达终点） -->
                        <g id="checkmark" viewBox="0 0 33 33" transform="scale(0.34)">
                            <circle cx="16.5" cy="16.5" r="14" fill="none" stroke="currentColor" stroke-width="3" />
                            <circle cx="16.5" cy="16.5" r="13" fill="currentColor" />
                            <path d="M9 17L14.5 22.5L24 11" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
                        </g>
                    </defs>

                    <!-- 上方通道 -->
                    <use href="#vr" x="0" y="-80" color="#a6d8b7" data-cpos="50" />
                    <use href="#vr" x="-12" y="-80" color="#f7a099" data-cpos="49" />
                    <use href="#vr" x="-24" y="-80" color="#afccea" data-cpos="48" />
                    <use href="#vr" x="12" y="-80" color="#ecbd99" data-cpos="-3" />
                    <use href="#vr" x="24" y="-80" color="#afccea" data-cpos="-2" />

                    <!-- 上方转角 -->
                    <use href="#t2" x="-38" y="-80" color="#ecbd99" data-cpos="47" />
                    <use href="#t1" x="38" y="-80" color="#f7a099" data-cpos="1" />

                    <!-- 上方侧边通道 -->
                    <use href="#hr" x="-38.5" y="-66" color="#a6d8b7" data-cpos="46" />
                    <use href="#hr" x="-38.5" y="-53.5" color="#f7a099" data-cpos="45" />
                    <use href="#hr" x="38.5" y="-66" color="#a6d8b7" data-cpos="2" />
                    <use href="#hr" x="38.5" y="-53.5" color="#ecbd99" data-cpos="3" />

                    <!-- 上方内侧转角 -->
                    <use href="#t3" x="38.5" y="-39" color="#afccea" data-cpos="4" />
                    <use href="#t2" x="38.5" y="-38" color="#f7a099" data-cpos="5" />
                    <use href="#t4" x="-38.5" y="-39" color="#afccea" data-cpos="44" />
                    <use href="#t1" x="-38.5" y="-38" color="#ecbd99" data-cpos="43" />

                    <!-- 下方通道 -->
                    <use href="#vr" x="0" y="80" color="#afccea" data-cpos="24" />
                    <use href="#vr" x="-12" y="80" color="#f7a099" data-cpos="25" />
                    <use href="#vr" x="-24" y="80" color="#a6d8b7" data-cpos="26" />
                    <use href="#vr" x="12" y="80" color="#ecbd99" data-cpos="23" />
                    <use href="#vr" x="24" y="80" color="#a6d8b7" data-cpos="22" />

                    <!-- 下方转角 -->
                    <use href="#t4" x="-38" y="80" color="#ecbd99" data-cpos="27" />
                    <use href="#t3" x="38" y="80" color="#f7a099" data-cpos="21" />

                    <!-- 下方侧边通道 -->
                    <use href="#hr" x="-38.5" y="66" color="#afccea" data-cpos="28" />
                    <use href="#hr" x="-38.5" y="53.5" color="#f7a099" data-cpos="29" />
                    <use href="#hr" x="38.5" y="66" color="#afccea" data-cpos="20" />
                    <use href="#hr" x="38.5" y="53.5" color="#ecbd99" data-cpos="19" />

                    <!-- 下方内侧转角 -->
                    <use href="#t2" x="-38.5" y="39" color="#a6d8b7" data-cpos="30" />
                    <use href="#t3" x="-38.5" y="38" color="#ecbd99" data-cpos="31" />
                    <use href="#t4" x="38.5" y="38" color="#f7a099" data-cpos="17" />
                    <use href="#t1" x="38.5" y="39" color="#a6d8b7" data-cpos="18" />

                    <!-- 左侧通道 -->
                    <use href="#hr" x="-80" y="0" color="#f7a099" data-cpos="37" />
                    <use href="#hr" x="-80" y="-12" color="#a6d8b7" data-cpos="38" />
                    <use href="#hr" x="-80" y="-24" color="#ecbd99" data-cpos="39" />
                    <use href="#hr" x="-80" y="12" color="#afccea" data-cpos="36" />
                    <use href="#hr" x="-80" y="24" color="#ecbd99" data-cpos="35" />

                    <!-- 左侧转角 -->
                    <use href="#t2" x="-80" y="-38" color="#afccea" data-cpos="40" />
                    <use href="#t4" x="-80" y="38" color="#a6d8b7" data-cpos="34" />

                    <!-- 左侧侧边通道 -->
                    <use href="#vr" x="-65.5" y="38" color="#f7a099" data-cpos="33" />
                    <use href="#vr" x="-53" y="38" color="#afccea" data-cpos="32" />
                    <use href="#vr" x="-65.5" y="-38" color="#f7a099" data-cpos="41" />
                    <use href="#vr" x="-53" y="-38" color="#a6d8b7" data-cpos="42" />

                    <!-- 右侧通道 -->
                    <use href="#hr" x="80" y="0" color="#ecbd99" data-cpos="11" />
                    <use href="#hr" x="80" y="-12" color="#a6d8b7" data-cpos="10" />
                    <use href="#hr" x="80" y="-24" color="#f7a099" data-cpos="9" />
                    <use href="#hr" x="80" y="12" color="#afccea" data-cpos="12" />
                    <use href="#hr" x="80" y="24" color="#f7a099" data-cpos="13" />

                    <!-- 右侧转角 -->
                    <use href="#t1" x="80" y="-38" color="#afccea" data-cpos="8" />
                    <use href="#t3" x="80" y="38" color="#a6d8b7" data-cpos="14" />

                    <!-- 右侧侧边通道 -->
                    <use href="#vr" x="65.5" y="38" color="#ecbd99" data-cpos="15" />
                    <use href="#vr" x="53" y="38" color="#afccea" data-cpos="16" />
                    <use href="#vr" x="65.5" y="-38" color="#ecbd99" data-cpos="7" />
                    <use href="#vr" x="53" y="-38" color="#a6d8b7" data-cpos="6" />

                    <!-- 中央终点通道 -->
                    <use href="#vr2" x="66" y="0" color="#ecbd99" data-cpos="51" />
                    <use href="#vr2" x="54" y="0" color="#ecbd99" data-cpos="52" />
                    <use href="#vr2" x="42" y="0" color="#ecbd99" data-cpos="53" />
                    <use href="#vr2" x="30" y="0" color="#ecbd99" data-cpos="54" />
                    <use href="#vr2" x="18" y="0" color="#ecbd99" data-cpos="55" />

                    <use href="#vr2" x="-66" y="0" color="#f7a099" data-cpos="51" />
                    <use href="#vr2" x="-54" y="0" color="#f7a099" data-cpos="52" />
                    <use href="#vr2" x="-42" y="0" color="#f7a099" data-cpos="53" />
                    <use href="#vr2" x="-30" y="0" color="#f7a099" data-cpos="54" />
                    <use href="#vr2" x="-18" y="0" color="#f7a099" data-cpos="55" />

                    <use href="#hr2" x="0" y="66" color="#afccea" data-cpos="51" />
                    <use href="#hr2" x="0" y="54" color="#afccea" data-cpos="52" />
                    <use href="#hr2" x="0" y="42" color="#afccea" data-cpos="53" />
                    <use href="#hr2" x="0" y="30" color="#afccea" data-cpos="54" />
                    <use href="#hr2" x="0" y="18" color="#afccea" data-cpos="55" />

                    <use href="#hr2" x="0" y="-66" color="#a6d8b7" data-cpos="51" />
                    <use href="#hr2" x="0" y="-54" color="#a6d8b7" data-cpos="52" />
                    <use href="#hr2" x="0" y="-42" color="#a6d8b7" data-cpos="53" />
                    <use href="#hr2" x="0" y="-30" color="#a6d8b7" data-cpos="54" />
                    <use href="#hr2" x="0" y="-18" color="#a6d8b7" data-cpos="55" />

                    <!-- 终点三角形-->
                    <use href="#end" x="0" y="-2" color="#afccea" transform="translate(0,3)" data-cpos="56" />
                    <use href="#end" x="0" y="-2" color="#f7a099" transform="rotate(90,0,0) translate(0,3)" data-cpos="56" />
                    <use href="#end" x="0" y="-2" color="#a6d8b7" transform="rotate(180,0,0) translate(0,3)" data-cpos="56" />
                    <use href="#end" x="0" y="-2" color="#ecbd99" transform="rotate(270,0,0) translate(0,3)" data-cpos="56" />

                    <!-- 四个角的起飞区域 -->
                    <use href="#start" x="-68" y="72" color="#afccea" />
                    <use href="#start" x="-72" y="-68" color="#f7a099" />
                    <use href="#start" x="68" y="-72" color="#a6d8b7" />
                    <use href="#start" x="72" y="68" color="#ecbd99" />
                    <!-- 飞行轨道指示箭头 -->
                    <use href="#arrow" x="-24" y="-47" color="#afccea" />
                    <use href="#arrow" x="12" y="-47" color="#afccea" />

                    <use href="#arrow" x="-24" y="-47" color="#a6d8b7" transform="rotate(180,0,0)" />
                    <use href="#arrow" x="12" y="-47" color="#a6d8b7" transform="rotate(180,0,0)" />

                    <use href="#arrow" x="-24" y="-47" color="#f7a099" transform="rotate(90,0,0)" />
                    <use href="#arrow" x="12" y="-47" color="#f7a099" transform="rotate(90,0,0)" />

                    <use href="#arrow" x="-24" y="-47" color="#ecbd99" transform="rotate(270,0,0)" />
                    <use href="#arrow" x="12" y="-47" color="#ecbd99" transform="rotate(270,0,0)" />

                    <!-- 飞机棋子-->
                    
                    
                    
                    

                    
                    
                    
                    

                    
                    
                    
                    

                    
                    
                    
                    

                </svg>